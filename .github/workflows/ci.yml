name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[audio,ml,api,dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/ training/

      - name: Type check with mypy
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[audio,ml,api,dev]"

      - name: Run tests with coverage
        run: pytest --cov=prosody_protocol --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  test-core-only:
    # The base install (lxml only) must import and pass every test that does
    # not need an optional extra; the rest must skip, not error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + test tools only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run tests
        run: pytest

  wheel-smoke:
    # Build the wheel and check the installed package (not the checkout) works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel with api extra and smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)[api]"
          cd /tmp
          /tmp/smoke/bin/python -c "import prosody_protocol, prosody_protocol.server.app; print(prosody_protocol.__version__)"
          /tmp/smoke/bin/prosody-protocol --help
          /tmp/smoke/bin/python -m prosody_protocol.server --port 8765 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/v1/health
