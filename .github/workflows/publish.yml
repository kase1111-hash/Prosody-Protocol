name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/prosody_protocol/_version.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match package version '$version'" >&2
            exit 1
          fi

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke test the built wheel (core install)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$(ls dist/*.whl)"
          /tmp/smoke/bin/python -c "import prosody_protocol; print(prosody_protocol.__version__)"
          echo '<utterance>Hello there.</utterance>' | /tmp/smoke/bin/prosody-protocol validate -

      - name: Run the test suite against the built wheel
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          python -m venv /tmp/full
          /tmp/full/bin/pip install "$(ls dist/*.whl)[audio,ml,api]" pytest httpx jsonschema
          # Run from the checkout's tests against the installed wheel, not src/.
          cp -r tests /tmp/tests && cd /tmp && /tmp/full/bin/python -m pytest tests -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
