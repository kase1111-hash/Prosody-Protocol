task: text_to_prosody
description: "Per-token prosody labels (read from IML markup) predicted from plain-text features by a decision tree"

model:
  type: decision_tree          # scikit-learn baseline
  max_depth: 10

data:
  text_features:
    - word_length
    - position_ratio
    - is_capitalized
    - has_punctuation
    - sentence_position
    - prev_word_length
    - next_word_length
  labels:                      # label dimensions, read from <prosody>/<emphasis>/<segment>
    pitch_level:
      - high
      - mid
      - low
    volume_level:
      - loud
      - normal
      - quiet
    rate_level:
      - fast
      - normal
      - slow

training:                      # scikit-learn DecisionTreeClassifier parameters
  min_samples_split: 2
  min_samples_leaf: 1
  random_state: 42

evaluation:
  metrics:
    - precision
    - recall
    - f1
  average: macro

output:
  checkpoint_dir: training/checkpoints/text_prosody_tree
  export_format: json
